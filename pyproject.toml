[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliable-guest-agent"
version = "0.1.0"
description = "A production-oriented guest request triage agent with human approval boundaries."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reliable_guest_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: requires the dedicated PostgreSQL integration-test database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
